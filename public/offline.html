<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مفيش نت</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .card{max-width:420px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:18px;
        padding:32px 28px;text-align:center;box-shadow:0 20px 45px rgba(15,23,42,.10)}
  h1{font-size:20px;font-weight:800;color:#0f172a;margin:0 0 10px}
  p{font-size:15px;color:#475569;line-height:1.9;margin:0 0 24px}
  button{background:#6366f1;color:#fff;border:none;border-radius:10px;padding:11px 22px;
         font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:44px;line-height:1;margin-bottom:16px">📡</div>
    <h1>مفيش اتصال بالإنترنت</h1>
    <!-- Says plainly that nothing is shown rather than showing something old.
         This app's data is only useful when it is current. -->
    <p>السيستم محتاج نت عشان يجيب الأوردرات. اتأكد من الاتصال وجرّب تاني.</p>
    <button onclick="location.reload()">حاول تاني</button>
  </div>
</body>
</html>
